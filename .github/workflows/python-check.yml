name: Python syntax check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m py_compile app.py local_cache.py pokescan_lookup.py pokescan_ocr.py pokescan_parser.py build_cache.py
